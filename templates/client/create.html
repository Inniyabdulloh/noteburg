        </div>

        {#            my code start #}
        <div class="container-fluid">
            <div class="row">
              <div class="col-sm-12">
                
                <div class="card">
                  <div class="card-header pb-0">
                    <h5>Create Client</h5>
                  </div>
                  <form class="form theme-form" method="post" action="{% url 'main:create-client' %}">
                    {% csrf_token %}
                    <div class="card-body">
                      <div class="row">
                        <div class="col">
                          <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">First name</label>
                            <div class="col-sm-9">
                              <input name="first-name" class="form-control" type="text" placeholder="Your first name" required>
                            </div>
                          </div>
                          <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Last name</label>
                            <div class="col-sm-9">
                              <input name="last-name" class="form-control" type="text" placeholder="Type your last name" required>
                            </div>
                          </div>
                          <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Passport</label>
                            <div class="col-sm-9">
                              <input name="passport" class="form-control digits" type="text" placeholder="Passport" required>
                            </div>
                          </div>
                          <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Telephone</label>
                            <div class="col-sm-9">
                              <input name="phone" class="form-control m-input digits" type="tel" value="91-(999)-999-999" required>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="card-footer text-end pt-0">
                      <div class="col-sm-9 offset-sm-3">
                        <button class="btn btn-primary" type="submit">Submit</button>
                        <input class="btn btn-light" type="reset" value="Cancel">
                      </div>
                    </div>
                  </form>
                </div>
                
              </div>
            </div>
          </div>
        {#        my code end #}

    


{% endblock %}
